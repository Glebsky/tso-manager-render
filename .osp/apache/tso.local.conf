# ============================================================
# HTTP/2
# ============================================================

<IfModule mod_http2.c>
    Protocols h2 http/1.1
</IfModule>


# ============================================================
# Laravel
# ============================================================

<Directory "{base_dir}/public">
    DirectoryIndex index.php
    AllowOverride All
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>


# ============================================================
# Request limits
# ============================================================

# Маркет-синхронизация и выгрузка zone_data бывают крупными (64 MB).
LimitRequestBody 67108864


# ============================================================
# Security
# ============================================================

<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
