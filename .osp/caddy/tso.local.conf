    import common_host tso.local

    # Laravel: фронт-контроллер. Существующие файлы отдаются как есть,
    # всё остальное — в index.php. browse убран намеренно: листинг каталогов
    # на Laravel-проекте — это утечка структуры, а не удобство.

    @hidden path_regexp \/\.(?!well-known)
    respond @hidden 403

    try_files {path} {path}/ /index.php?{query}

    file_server {
        index index.php
    }

    request_body {
        max_size 64MB
    }
