    import common_host tso.local

    # Laravel front controller: static files are served directly,
    # everything else is routed to index.php. Directory browsing is disabled.

    @hidden path_regexp \/\.(?!well-known)
    respond @hidden 403

    try_files {path} {path}/ /index.php?{query}

    file_server {
        index index.php
    }

    request_body {
        max_size 64MB
    }
