; WARNING: Variables from this file are injected directly into the PHP process environment.
; Laravel (vlucas/phpdotenv) DOES NOT overwrite already existing environment variables:
; anything declared here will take precedence over the matching key in .env.
; Keep this file minimal/empty to avoid configuration conflicts.
;
; Application configuration belongs in .env. Secrets stay only in .env (not tracked in Git).

[tso.local]

; Legitimate use case: variables specific to a local developer machine, not the application itself.
; Example (commented out by default):
;
; COMPOSER_MEMORY_LIMIT = -1
PY_PYTHON = 3.13