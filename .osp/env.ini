; ВНИМАНИЕ. Переменные из этого файла попадают в окружение процесса PHP.
; Laravel (vlucas/phpdotenv) НЕ перезаписывает уже существующие переменные окружения:
; всё, что объявлено здесь, победит одноимённую строку в .env и вы будете
; час искать, почему .env "не применяется". Держите этот файл пустым.
;
; Конфигурация приложения живёт в .env. Секреты — только там, .env в гите нет.

[tso.local]

; Единственный оправданный случай: переменные, которых в .env быть не должно,
; потому что они описывают конкретную машину разработчика, а не приложение.
; Пример (закомментировано, включайте осознанно):
;
; COMPOSER_MEMORY_LIMIT = -1
PY_PYTHON = 3.13