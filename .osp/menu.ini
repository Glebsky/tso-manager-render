; Пункты контекстного меню проекта в трее OpenServer.
; Имена секций нумеруются с нуля и задают порядок отображения.
;
; КЛЮЧЕВОЕ ПРАВИЛО: каждая команда, которой нужен php, composer или node,
; начинается с "osp project {host} &".
;
; Окно cmd, открытое из меню, наследует системный PATH, а не PATH OpenServer.
; Системного php на машине нет — отсюда "php не является внутренней командой".
; "osp project {host}" поднимает окружение проекта: подставляет в PATH именно те
; версии PHP и Node, которые заданы в php_engine / node_engine в project.ini,
; и переходит в project_root. Поэтому "cd /d {base_dir}" больше не нужен.
;
; Побочный эффект, ради которого это и нужно: поменяете php_engine — все пункты
; меню автоматически переедут на новую версию. Ничего править здесь не надо.

[tso.local-0]

caption  = {lang_gates}
category = projects\tso.local
command  = cmd.exe /k "osp project {host} & php artisan test & php vendor\bin\pint --test & php vendor\bin\phpstan analyse & npm run build"
enabled  = on
hide     = off
icon     = circle-check

[tso.local-1]

caption  = {lang_shell}
category = projects\tso.local
command  = cmd.exe /k "osp project {host} & php -v & node -v"
enabled  = on
hide     = off
icon     = terminal

