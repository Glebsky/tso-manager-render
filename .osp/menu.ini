; Здесь php не нужен, но нужен правильный текущий каталог.
[tso.local-10]

caption  = {lang_tail_log}
category = projects\tso.local
command  = cmd.exe /k "cd /d {base_dir} & powershell -NoProfile -Command ""if (!(Test-Path storage\logs\laravel.log)) { New-Item -ItemType File -Force storage\logs\laravel.log | Out-Null }; Get-Content -Wait -Tail 200 storage\logs\laravel.log"""
enabled  = on
hide     = off
icon     = file-lines

; Чисто файловая операция, окружение проекта не требуется.
[tso.local-11]

caption  = {lang_create_backup}
category = projects\tso.local
command  = cmd.exe /k "mkdir {base_dir}\.osp\backup >nul 2>&1 & 7za a -tzip {base_dir}\.osp\backup\backup_{date_time}.zip {base_dir}\* -xr!.osp\backup -xr!vendor -xr!node_modules -xr!storage\logs -xr!storage\framework -xr!public\build -xr!.git & explorer.exe /select,{base_dir}\.osp\backup\backup_{date_time}.zip"
enabled  = on
hide     = off
icon     = file-zipper
