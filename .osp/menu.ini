enabled  = on
hide     = off
icon     = code

; PHP environment is not required here, but the working directory must be project root.
[tso.local-10]

caption  = {lang_tail_log}
category = projects\tso.local
command  = cmd.exe /k "cd /d {base_dir} & powershell -NoProfile -Command ""$f = (Get-ChildItem storage\logs\laravel*.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1); if (!$f) { New-Item -ItemType File -Force storage\logs\laravel.log | Out-Null; $f = Get-Item storage\logs\laravel.log }; Write-Host ('=== Tailing: ' + $f.Name + ' ==='); Get-Content -Wait -Tail 200 $f.FullName"""
enabled  = on
hide     = off
icon     = file-lines

; File system operation, project runtime environment is not needed.
[tso.local-11]

caption  = {lang_create_backup_project}
category = projects\tso.local
command  = cmd.exe /k "mkdir {base_dir}\.osp\backup >nul 2>&1 & 7za a -tzip {base_dir}\.osp\backup\backup_{date_time}.zip {base_dir}\* -xr!.osp\backup -xr!vendor -xr!node_modules -xr!storage\logs -xr!storage\framework -xr!public\build -xr!.git & explorer.exe /select,{base_dir}\.osp\backup\backup_{date_time}.zip"
enabled  = on
hide     = off
icon     = file-zipper
