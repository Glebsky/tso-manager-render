; Custom context menu items for OpenServer tray.
; Section names are indexed starting from 0 and define the display order.
;
; RULE: Every command requiring php, composer, or node must start with "osp project {host} &".
; "osp project {host}" activates the project environment (injects PHP/Node versions from project.ini into PATH)
; and navigates to project_root.
;
; Changing php_engine in project.ini automatically migrates all menu items to the new version.

[tso.local-0]

caption  = {lang_gates}
category = projects\tso.local
command  = cmd.exe /k "osp project {host} & php artisan test & php vendor\bin\pint --test & php vendor\bin\phpstan analyse & npm run build"
enabled  = on
hide     = off
icon     = circle-check

[tso.local-1]

caption  = {lang_shell}
category = projects\tso.local
command  = cmd.exe /k "osp project {host} & php -v & node -v"
enabled  = on
hide     = off
icon     = terminal

[tso.local-2]

caption  = {lang_vite_dev}
category = projects\tso.local
command  = cmd.exe /k "osp project {host} & npm run dev"
enabled  = on
hide     = off
icon     = bolt

[tso.local-3]

caption  = {lang_vite_build}
category = projects\tso.local
command  = cmd.exe /k "osp project {host} & npm run build"
