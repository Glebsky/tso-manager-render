[tso.local]

; Any command requiring php, composer, or node must start with "osp project {host} &".
; The OpenServer task scheduler runs with the system PATH where php is not present by default.

; Queue worker watchdog. Keeps the long-running worker defined in app_start_command (project.ini) alive.
; "osp project {host} start" does not spawn duplicate processes if already running.
; Flag 1 0: every minute, 1 = single instance (no parallel runs), 0 = hidden window.
Queue worker watchdog = * * * * * 1 0 cmd.exe /c "osp project {host} start"

; TSO master scheduler. Runs once every minute.
; Handles task scheduling, market sync, account sync, log retention cleanup, and inline queue processing.
; Flag 1 0: every minute, 1 = single instance (prevents overlap during 50s work cycle), 0 = hidden window.
Laravel scheduler     = * * * * * 1 0 cmd.exe /c "osp project {host} & php artisan tso:run-scheduler --work"
