[tso.local]

; Any command requiring php, composer, or node must start with "osp project {host} &".
; The OpenServer task scheduler runs with the system PATH where php is not present by default.

; Queue worker for background tasks and market analytics.
Queue worker      = * * * * * * * cmd.exe /c "osp project {host} & php artisan queue:work --queue=tso-tasks,tso-accounts,tso-market,default"

; Master task scheduler and periodic synchronization loop.
Laravel scheduler = * * * * * * * cmd.exe /c "osp project {host} & php artisan tso:run-scheduler --work"
