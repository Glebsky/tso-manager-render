[tso.local]

; Всё, что вызывает php или node, обязано начинаться с "osp project {host} &".
; Планировщик OpenServer запускает команды с системным PATH, где php нет.
; Именно так сделано в штатном примере: "osp project {host} & php -f cron.php".

; Поддержание воркера очереди. Сама команда — в app_start_command (project.ini).
; "osp project {host} start" не плодит копии: если процесс жив, вызов ничего не делает.
; Флаг 1 0: проверка каждую минуту, 1 = одиночный экземпляр (без параллельного запуска), 0 = скрытое окно.
Queue worker watchdog = * * * * * 1 0 cmd.exe /c "osp project {host} start"

; Планировщик Laravel. Вызывается ровно раз в минуту по контракту Laravel schedule:run.
; Запускает tso:run-scheduler с защитой withoutOverlapping из routes/console.php.
Laravel scheduler     = * * * * * * 0 cmd.exe /c "osp project {host} & php artisan schedule:run"
