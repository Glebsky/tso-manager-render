# Laravel front controller: route non-existing files to public/index.php.
# web_root already points to {base_dir}\public (see project.ini), root directive is not needed here.

location / {
    index index.php;
    try_files $uri $uri/ /index.php?$query_string;
}

# Vite build static assets (filenames contain content hashes, safe to cache long-term).
location /build/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# Hidden files: .env, .git, .user.ini, etc.
location ~ /\.(?!well-known).* {
    deny all;
}

# Market sync and zone_data payloads can be large.
client_max_body_size 64m;
