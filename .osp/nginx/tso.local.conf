# Laravel: всё, что не существует как файл, уходит в public/index.php.
# web_root уже указывает на {base_dir}\public (см. project.ini), здесь root не нужен.

location / {
    index index.php;
    try_files $uri $uri/ /index.php?$query_string;
}

# Статика сборки Vite. В именах файлов есть хеш, поэтому кеш безопасен.
location /build/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# Скрытые файлы: .env, .git, .user.ini и прочее.
location ~ /\.(?!well-known).* {
    deny all;
}

# Маркет-синхронизация и выгрузка zone_data бывают крупными.
client_max_body_size 64m;
