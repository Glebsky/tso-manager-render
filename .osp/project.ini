[tso.local]

app_start_command = cmd.exe /c "osp project {host} & php artisan queue:work --queue=tso-tasks,tso-accounts,tso-market,default --tries=3 --timeout=120 --sleep=1"
backend_enabled   = off
backend_ip        = 127.0.0.1
backend_port      = 5173
base_url          = {host_scheme}://{host_decoded}{scheme_port}
bind_ip           = auto
environment       = System
http_engine       = Apache
http_port         = 80
https_port        = 443
node_engine       = auto
php_engine        = PHP-8.5
primary_domain    = on
project_category  = TSO
project_enabled   = on
project_root      = {base_dir}
server_aliases    = www.{host}
terminal_codepage = 65001
tls_cert_file     = auto
tls_enabled       = on
tls_key_file      = auto
web_root          = {base_dir}\public
