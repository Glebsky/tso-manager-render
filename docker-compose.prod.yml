services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    # Uses app_public volume to share public files with nginx
    volumes:
      - app_public:/var/www/html/public
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_DATABASE=tso_manager
      - DB_USERNAME=tso_admin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - LOG_CHANNEL=stderr
    restart: unless-stopped

  nginx:
    volumes:
      - app_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  node:
    profiles:
      - dev-only

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    volumes: []
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_DATABASE=tso_manager
      - DB_USERNAME=tso_admin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - LOG_CHANNEL=stderr
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    volumes: []
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_DATABASE=tso_manager
      - DB_USERNAME=tso_admin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - LOG_CHANNEL=stderr
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: tso_manager
      POSTGRES_USER: tso_admin
      POSTGRES_PASSWORD: secret
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  app_public:
