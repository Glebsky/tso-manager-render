version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    # Uses app_public volume to share public files with nginx
    volumes:
      - app_public:/var/www/html/public
    restart: unless-stopped

  nginx:
    volumes:
      - app_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  node:
    profiles:
      - dev-only

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    # In Compose V2, use !reset [] to clear volumes from base, or just mount dummy volume if !reset is unsupported.
    # Here we specify an empty list. If your Compose version appends instead of overriding, 
    # you may need to use `volumes: !reset []`
    volumes: []
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    volumes: []
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  app_public:
