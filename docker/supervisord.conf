[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:php-fpm]
command=php-fpm -F
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/supercronic -passthrough-logs /etc/crontab.app
user=www-data
directory=/var/www/html
autostart=%(ENV_ENABLE_SCHEDULER)s
autorestart=true
startretries=3
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=php -d memory_limit=256M /var/www/html/artisan queue:work --queue=%(ENV_TSO_WORKER_QUEUES)s --sleep=3 --tries=3 --timeout=150 --max-time=3600
user=www-data
directory=/var/www/html
autostart=%(ENV_ENABLE_WORKER)s
autorestart=true
startretries=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
