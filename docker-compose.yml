services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      # Mount only code directories
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - /var/www/html/bootstrap/cache # Protect bootstrap cache
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - ./artisan:/var/www/html/artisan
      - ./composer.json:/var/www/html/composer.json
      - ./package.json:/var/www/html/package.json
      - ./vite.config.js:/var/www/html/vite.config.js
      - /var/www/html/vendor
      # Mount storage but protect volatile subdirectories using anonymous volumes
      - ./storage:/var/www/html/storage
      - /var/www/html/storage/framework/cache
      - /var/www/html/storage/framework/sessions
      - /var/www/html/storage/framework/views
      - /var/www/html/storage/logs
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_DATABASE=tso_manager
      - DB_USERNAME=tso_admin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - LOG_CHANNEL=stderr
    networks:
      - tso-network

  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tso-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  node:
    container_name: node
    image: node:20-alpine
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    command: sh -c 'npm install && npm run dev -- --host 0.0.0.0'
    networks:
      - tso-network

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tso_manager
      POSTGRES_USER: tso_admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tso-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tso_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - tso-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    container_name: worker
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - /var/www/html/bootstrap/cache
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./artisan:/var/www/html/artisan
      - ./composer.json:/var/www/html/composer.json
      - /var/www/html/vendor
      - ./storage:/var/www/html/storage
      - /var/www/html/storage/framework/cache
      - /var/www/html/storage/framework/sessions
      - /var/www/html/storage/framework/views
      - /var/www/html/storage/logs
    depends_on:
      - app
      - postgres
      - redis
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_DATABASE=tso_manager
      - DB_USERNAME=tso_admin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - LOG_CHANNEL=stderr
    networks:
      - tso-network
    restart: unless-stopped

  scheduler:
    container_name: scheduler
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: php artisan schedule:work
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - /var/www/html/bootstrap/cache
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./artisan:/var/www/html/artisan
      - ./composer.json:/var/www/html/composer.json
      - /var/www/html/vendor
      - ./storage:/var/www/html/storage
      - /var/www/html/storage/framework/cache
      - /var/www/html/storage/framework/sessions
      - /var/www/html/storage/framework/views
      - /var/www/html/storage/logs
    depends_on:
      - app
      - postgres
      - redis
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_DATABASE=tso_manager
      - DB_USERNAME=tso_admin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - LOG_CHANNEL=stderr
    networks:
      - tso-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  tso-network:
    driver: bridge
